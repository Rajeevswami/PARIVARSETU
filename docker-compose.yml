# New volumes use FamilyNexus defaults. An existing volume initialized as
# role/db "parivarsetu" must be renamed with
# scripts/migrate_parivarsetu_to_familynexus.sh BEFORE these defaults apply.
# Compose interpolates ${DB_USER} from the root .env or the shell, not from
# backend/.env. The db healthcheck uses that same value.
services:
  db:
    image: postgres:17-alpine
    # This image does not include pgvector. Switch to pgvector/pgvector:pg17
    # only after that image is pulled, then run sync_pgvector. Do not down -v.
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-familynexus}
      POSTGRES_USER: ${DB_USER:-familynexus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-familynexus}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-familynexus}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        ENV: dev
    env_file: ./backend/.env
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      args:
        ENV: dev
    env_file: ./backend/.env
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    depends_on:
      - backend

  celery_beat:
    build:
      context: ./backend
      args:
        ENV: dev
    env_file: ./backend/.env
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    depends_on:
      - backend

  frontend:
    image: node:22-alpine
    working_dir: /app
    env_file: ./frontend/.env
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"

volumes:
  pgdata:
