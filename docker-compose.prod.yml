services:
  db:
    image: postgres:17-alpine
    # This image does not include pgvector. To enable it, switch to
    # pgvector/pgvector:pg17 and run `python manage.py sync_pgvector`.
    # Do not change this line until that image has been pulled and checked.
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    restart: always

  backend:
    build:
      context: ./backend
      args:
        ENV: production
    env_file: ./backend/.env
    restart: always
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: ./backend
      args:
        ENV: production
    env_file: ./backend/.env
    command: celery -A config worker -l info
    restart: always
    depends_on:
      - backend

  celery_beat:
    build:
      context: ./backend
      args:
        ENV: production
    env_file: ./backend/.env
    command: celery -A config beat -l info
    restart: always
    depends_on:
      - backend

  frontend:
    build: ./frontend
    restart: always
    depends_on:
      - backend

  nginx:
    build: ./nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
