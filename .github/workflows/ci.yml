name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: parivarsetu_test
          POSTGRES_USER: parivarsetu
          POSTGRES_PASSWORD: parivarsetu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parivarsetu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r backend/requirements/dev.txt
      - name: Lint (black, isort, flake8)
        run: |
          cd backend
          black --check .
          isort --check .
          flake8 .
      - name: Django check
        env:
          SECRET_KEY: ci-test-key
          DB_HOST: localhost
          DB_NAME: parivarsetu_test
          DB_USER: parivarsetu
          DB_PASSWORD: parivarsetu
          REDIS_URL: redis://localhost:6379/0
        run: cd backend && python manage.py check
      - name: Tests
        env:
          SECRET_KEY: ci-test-key
          DB_HOST: localhost
          DB_NAME: parivarsetu_test
          DB_USER: parivarsetu
          DB_PASSWORD: parivarsetu
          REDIS_URL: redis://localhost:6379/0
        run: cd backend && pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npx tsc -b
      - run: cd frontend && npm run test
      - run: cd frontend && npm run build
